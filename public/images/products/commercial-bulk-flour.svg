<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bulkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <pattern id="polyWeave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0 L8 8 M8 0 L0 8" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bulkGrad)"/>
  
  <!-- 50kg Heavy Industrial Polypropylene Sack -->
  <g transform="translate(90, 40)">
    <!-- Main sack body -->
    <path d="M15 30 L205 30 L215 295 L5 295 Z" fill="#F8FAFC" stroke="#475569" stroke-width="3"/>
    <rect x="15" y="30" width="195" height="265" fill="url(#polyWeave)" opacity="0.6"/>
    
    <!-- Top heat seal stitch line -->
    <path d="M10 25 L210 25" stroke="#DC2626" stroke-width="4" stroke-dasharray="6,4"/>
    
    <!-- Bold Commercial Print Band -->
    <rect x="25" y="80" width="170" height="125" rx="3" fill="#0F172A"/>
    
    <text x="110" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="20" fill="#F8FAFC" letter-spacing="1">
      50 KG NET
    </text>
    <text x="110" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="14" fill="#F59E0B" letter-spacing="2">
      COMMERCIAL BULK
    </text>
    <text x="110" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#94A3B8">
      WHEAT ATTA / FLOUR
    </text>
    
    <!-- Red Accent Bar -->
    <rect x="40" y="165" width="140" height="22" fill="#DC2626" rx="2"/>
    <text x="110" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" letter-spacing="1.5">
      WHOLESALE LOT
    </text>
    
    <!-- Stamp -->
    <rect x="35" y="225" width="150" height="34" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="110" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#92400E">
      AL RAZZAQUE ENTERPRISE
    </text>
    <text x="110" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#64748B">
      HEAVY-DUTY WOVEN SACK
    </text>
  </g>
</svg>
