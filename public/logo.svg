<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Wheat Emblem -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="44" height="44" rx="8" fill="#B45309" />
    <path d="M22 6 L22 38" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Wheat grains left -->
    <ellipse cx="16" cy="14" rx="4" ry="2.5" transform="rotate(-30 16 14)" fill="#FEF3C7"/>
    <ellipse cx="15" cy="22" rx="4.5" ry="2.5" transform="rotate(-35 15 22)" fill="#FEF3C7"/>
    <ellipse cx="16" cy="30" rx="4" ry="2.5" transform="rotate(-30 16 30)" fill="#FEF3C7"/>
    <!-- Wheat grains right -->
    <ellipse cx="28" cy="14" rx="4" ry="2.5" transform="rotate(30 28 14)" fill="#FEF3C7"/>
    <ellipse cx="29" cy="22" rx="4.5" ry="2.5" transform="rotate(35 29 22)" fill="#FEF3C7"/>
    <ellipse cx="28" cy="30" rx="4" ry="2.5" transform="rotate(30 28 30)" fill="#FEF3C7"/>
    <!-- Apex grain -->
    <ellipse cx="22" cy="9" rx="2.5" ry="4" fill="#FEF3C7"/>
  </g>

  <!-- Typography -->
  <text x="64" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#1E293B" letter-spacing="0.5">
    AL RAZZAQUE
  </text>
  <text x="64" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400E" letter-spacing="2.5">
    ENTERPRISE • FLOUR &amp; ATTA
  </text>
</svg>
